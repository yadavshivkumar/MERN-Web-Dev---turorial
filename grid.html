<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <style>
        .container {
            height: 100px;
            border: 2px solid hwb(116 4% 8%);
            display: grid;
            grid-template-columns: 200px 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 10px;
        }
        .box{

            background-color: rgb(195, 7, 238);
            border: 3px solid rgb(208, 13, 13);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            I am a box
        </div>
        <div class="box">
            I am a box
        </div>
        <div class="box">
            I am a box
        </div>  
        <div class="box">
            I am a box
        </div>
        <div class="box">
            I am a box
        </div>
        <div class="box">
            I am a box
        </div>
        
        

    </div>
</body>
</html>
