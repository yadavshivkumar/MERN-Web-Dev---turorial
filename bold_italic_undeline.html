<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bold, Italic, and Underline</title>
</head>
<body>
    <p> I am <b>shiv</b>Shiv</p>
    <p> I am <i>shiv</i>Shiv</p>
    <p> I am <del>shiv</del>Shiv</p>
    <p> I am <u>Shiv</u></p>
    <p> I am <mark>Shiv</mark>      </p>
    <p> This is <b>bold</b> and <i> italic</i> text</p>
</body>
</html>
