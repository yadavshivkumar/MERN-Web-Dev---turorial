<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists</title>
</head>
<body>
    <h1>Lists</h1>
    <ul>
        <li>Apple</li>
        <li>Banana</li>
        <li>Cherry</li>
    </ul>
    <ol>
        <li>Wake up</li>
        <li>Brush teeth</li>
        <li>Have a breakfast</li>
    </ol>

    <dl>
        <dt>HTML</dt>
        <dd>HyperText Markup Language</dd>
        <dt>CSS</dt>
        <dd>Cascading Style Sheets</dd>
        <dt>JavaScript</dt>
        <dd>A programming language for the web</dd>
    </dl>
    <ul>
        <li>Fruits
            <ul>
            <li>Apple</li>
            <li>Banana</li>
            <li>Cherry</li>
        
    </ul>
    <li>Vegetables</li>
    
</body>
</html>
